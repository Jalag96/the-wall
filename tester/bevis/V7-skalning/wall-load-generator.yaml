apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  labels:
    app: load-generator
    app.kubernetes.io/part-of: the-wall
spec:
  restartPolicy: Never
  containers:
    - name: load-generator
      image: quay.io/kurs/centos:10
      command:
        - sleep
        - "3600"
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 128Mi
